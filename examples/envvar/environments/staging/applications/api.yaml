# This Application merges the variables declared by the `app-config` EnvVar resource.
api_version: iac-coolify/v1
kind: Application
metadata:
  name: api
  project: demo
  environment: staging
spec:
  build_pack: dockerimage
  image:
    name: registry.example.com/demo/api
    tag: v1-0-0
  destination:
    server: localhost
    network: coolify
  fqdn: https://api.example.com
  port: 8080
  env_vars_from:
    - app-config
  env_vars:
    - name: NODE_ENV
      value: production
