# Demonstrates ${env:VAR} interpolation across multiple visible (Param) string fields.
# Every ${env:...} below is resolved from the environment at load time and is shown in
# plan/apply output in clear — Param fields are NOT secret. Use value_secret (and ${env:}
# or ${sops:}) for sensitive values instead.
#
# Validate it with the referenced variables set, e.g.:
#   APP_NAME=api APP_ENV=staging IMAGE_REGISTRY=registry.example.com/api \
#   IMAGE_TAG=v1-2-3 PUBLIC_HOST=api.example.com DEPLOY_SERVER=localhost \
#   iac-coolify validate examples/env-interp/application.yaml
api_version: iac-coolify/v1
kind: Application
metadata:
  name: "${env:APP_NAME}"
  project: beenaire
  environment: "${env:APP_ENV}"
spec:
  build_pack: dockerimage
  image:
    name: "${env:IMAGE_REGISTRY}"
    tag: "${env:IMAGE_TAG}"
  port: 8080
  fqdn: "https://${env:PUBLIC_HOST}"
  destination:
    server: "${env:DEPLOY_SERVER}"
    network: coolify
  env_vars:
    - name: LOG_LEVEL
      value: "${env:APP_LOG_LEVEL}"
