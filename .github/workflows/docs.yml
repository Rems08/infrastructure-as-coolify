# Builds the mdBook documentation and deploys it to GitHub Pages. Enabling Pages
# (Settings -> Pages -> Source: GitHub Actions) is a one-time repository setting and
# must be done before the first deploy succeeds.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same toolchain as the Makefile pin.
env:
  GOTOOLCHAIN: go1.25.12

# Serialize deploys so a newer run never races an older one onto Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Regenerate the reference from the resource structs
        run: go run ./cmd/iac-coolify docs gen
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.3"
      - name: Build the book
        run: mdbook build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
