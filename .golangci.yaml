# golangci-lint strict preset. Pinned to golangci-lint v2 (see .github/workflows/ci.yml).
# gosimple is folded into staticcheck in v2; exclusion presets mirror v1's default-exclusions.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unused
  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: unused-parameter
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gocognit
          - gocyclo
          - gosec
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
