version: 2

project_name: iac-coolify

before:
  hooks:
    - go mod tidy

builds:
  - id: iac-coolify
    main: ./cmd/iac-coolify
    binary: iac-coolify
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# GHCR repository paths are lowercased by the registry, so the owner must be
# spelled "rems08" here even though the GitHub org is "Rems08" — an uppercase
# component makes the image reference unparseable.
dockers_v2:
  - id: image
    dockerfile: Dockerfile
    images:
      - ghcr.io/rems08/infrastructure-as-coolify
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/Rems08/infrastructure-as-coolify
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

# Keyless signing: cosign mints a short-lived certificate from the workflow's
# OIDC identity, so there is no long-lived key to manage. Each bundle is
# self-contained (signature + certificate + transparency-log proof).
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: archive
    output: true

docker_signs:
  - cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    artifacts: all
    output: true

# The cask lives in this same repository under Casks/, published through a
# pull request rather than a direct push so the update only lands on main
# once CI has passed. CASK_PR_TOKEN must be a personal access token: pull
# requests opened with the default Actions token never trigger workflows,
# so CI would not run and the auto-merge would wait forever.
homebrew_casks:
  - name: iac-coolify
    directory: Casks
    description: Declarative Infrastructure as Code for Coolify
    homepage: https://github.com/Rems08/infrastructure-as-coolify
    # Prereleases never touch the cask, mirroring release.prerelease: auto.
    skip_upload: auto
    commit_msg_template: "chore(release): update iac-coolify cask to {{ .Tag }}"
    repository:
      owner: Rems08
      name: infrastructure-as-coolify
      # One branch per version so a stale PR from a failed release can never
      # collide with the next release's push.
      branch: "cask-update-{{ .Version }}"
      token: "{{ .Env.CASK_PR_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: Rems08
          name: infrastructure-as-coolify
          branch: main
    # The binaries are cosign-signed but not Apple-notarized, so Gatekeeper
    # quarantines them on first run; drop the attribute after install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iac-coolify"]
          end

release:
  github:
    owner: Rems08
    name: infrastructure-as-coolify
  prerelease: auto

changelog:
  use: github-native
