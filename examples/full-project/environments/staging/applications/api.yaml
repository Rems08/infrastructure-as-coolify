api_version: iac-coolify/v1
kind: Application
metadata:
  name: api
  project: beenaire
  environment: staging
spec:
  build_pack: dockerimage
  image:
    name: registry.gitlab.com/beenaire/restaurant-core-api
    tag: v2-3-0
  destination:
    server: localhost
    network: coolify
  fqdn: https://api.beenaire.com
  port: 8000
  health_check:
    enabled: true
    path: /health
